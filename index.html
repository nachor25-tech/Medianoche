<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medianoche — monitor de riesgo global</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☢️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9E4D3;--panel:#F4F0E3;--line:#C6BFA6;--text:#22281F;--muted:#5F6656;
  --amber:#A86400;--red:#C02A1C;--grid:#D7D0B8;--land:#CDC5A8;--ok:#3F6B3A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121A15;--panel:#19231C;--line:#2E3C31;--text:#DCE3D4;--muted:#8E9B8C;
    --amber:#F2A93B;--red:#E5432F;--grid:#1F2B23;--land:#283729;--ok:#7FB26F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121A15;--panel:#19231C;--line:#2E3C31;--text:#DCE3D4;--muted:#8E9B8C;
  --amber:#F2A93B;--red:#E5432F;--grid:#1F2B23;--land:#283729;--ok:#7FB26F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
.stencil{font-family:"Saira Stencil One","Impact","Arial Black",sans-serif;font-weight:400}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--text);padding-bottom:10px}
header.top h1{margin:0;font-size:clamp(28px,6vw,44px);letter-spacing:.02em;line-height:1}
header.top p{margin:0;color:var(--muted);font-size:14px}
.demo{display:inline-block;margin-top:10px;padding:4px 8px;border:1px dashed var(--amber);color:var(--amber);font-size:13px}
.grid{display:grid;gap:16px;margin-top:16px;grid-template-columns:minmax(0,1fr)}
.grid>*,.panel{min-width:0}
@media(min-width:960px){.grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px}
.panel h2{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.01em}

/* Índice */
.hero{position:relative;overflow:hidden}
.hero .row{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.index{font-size:clamp(110px,26vw,190px);line-height:.82;color:var(--level)}
.level{font-size:clamp(26px,5vw,36px);line-height:1;color:var(--level);letter-spacing:.06em}
.levelSub{color:var(--muted);font-size:14px;margin-top:6px;max-width:34ch}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:18px 0 6px}
.scale div{height:10px;background:var(--grid)}
.scale div.on{background:var(--level)}
.scaleLbl{display:grid;grid-template-columns:repeat(5,1fr);font-size:12px;color:var(--muted)}
.hero.pulse .index{animation:flash 1.2s ease-in-out infinite}
@keyframes flash{50%{opacity:.55}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:16px}
.stats div{background:var(--panel);padding:10px}
.stats b{display:block;font-size:clamp(20px,4.5vw,28px);line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.cats{margin-top:16px;display:grid;gap:7px}
.cat{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:14px}
.bar{height:8px;background:var(--grid)}
.bar i{display:block;height:100%;background:var(--amber);transition:width .6s}
.bar i.hot{background:var(--red)}
.spark{margin-left:auto;text-align:right;color:var(--muted);font-size:13px}

/* Mapa */
.mapHead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mapHead h2{margin:0}
button.cmd{font:inherit;font-weight:600;font-size:14px;padding:8px 12px;background:transparent;color:var(--text);
  border:1.5px solid var(--text);cursor:pointer}
button.cmd:hover{background:var(--text);color:var(--panel)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mapBox{overflow-x:auto;border:1px solid var(--line);background:var(--bg)}
.mapBox svg{display:block;width:100%;min-width:560px;height:auto}
.alert{margin-top:10px;padding:10px 12px;border-left:4px solid var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);font-size:15px}
.alert b{color:var(--red)}
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.leader{border:1px solid var(--line);padding:8px 10px;font-size:14px}
.leader b{display:block;font-size:15px}
.leader small{color:var(--muted)}
.st{font-weight:600}
.st.vuelo{color:var(--amber)}.st.oculta{color:var(--red)}.st.tierra{color:var(--ok)}

/* Feed */
.feed{display:grid;gap:8px}
.ev{border:1px solid var(--line);background:var(--bg)}
.ev.new{animation:in .9s ease-out}
@keyframes in{from{background:color-mix(in srgb,var(--red) 25%,var(--bg))}}
.ev button{all:unset;display:block;width:100%;padding:10px 12px;cursor:pointer;box-sizing:border-box}
.ev button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.evTop{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.sev{display:inline-flex;gap:2px;vertical-align:middle;margin-right:6px}
.sev i{width:7px;height:10px;background:var(--grid)}
.sev i.on{background:var(--amber)}
.sev.s5 i.on,.sev.s4 i.on{background:var(--red)}
.evTitle{font-weight:600;font-size:16px;margin:4px 0 2px;line-height:1.3}
.evNums{display:flex;gap:14px;font-size:14px;flex-wrap:wrap}
.evNums em{font-style:normal;color:var(--muted)}
.evBody{padding:0 12px 12px;font-size:14px;color:var(--text)}
.evBody p{margin:0 0 8px;max-width:70ch}
.ia{color:var(--amber)}
.src{color:var(--muted);font-size:13px}
footer{color:var(--muted);font-size:13px;margin:24px 0 8px;max-width:70ch}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.plist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.plist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.plist b{display:block;font-size:15px}.plist small{display:block;color:var(--muted)}
.pst{text-align:right}
.st.noticias{color:var(--text)}.st.base{color:var(--muted);font-weight:500}
.srcLink{color:var(--amber);font-weight:600}
</style>
</head>
